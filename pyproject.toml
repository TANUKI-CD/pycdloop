[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycdloop"
dynamic = ["version"]
description = "Arithmetic in Cayley-Dickson loops, their central products, and their loop algebras"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Harrison Lemley" },
]
keywords = [
    "cayley-dickson",
    "loop-algebra",
    "nonassociative",
    "octonion",
    "walsh-hadamard",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pyfastcd>=1.3.1,<2",
]

[project.urls]
Homepage = "https://git.tanuki-cd.com/algebraity/pycdloop"
Source = "https://git.tanuki-cd.com/algebraity/pycdloop"
Documentation = "https://git.tanuki-cd.com/algebraity/pycdloop/src/branch/main/docs"
Changelog = "https://git.tanuki-cd.com/algebraity/pycdloop/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
]
benchmark = [
    "gmpy2>=2.2",
    "matplotlib>=3.8",
]
dev = [
    "build>=1.2",
    "gmpy2>=2.2",
    "matplotlib>=3.8",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.8",
    "twine>=5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycdloop = ["py.typed", "*.pyi"]

# The C source is compiled into the wheel, not shipped beside the module
[tool.setuptools.exclude-package-data]
pycdloop = ["*.c"]

# The version is defined once, in src/pycdloop/_version.py
[tool.setuptools.dynamic]
version = { attr = "pycdloop._version.__version__" }

# Wheels for the release workflow. Free-threaded builds are skipped because
# pyfastcd does not support them, and CPython 3.15 because CI does not test it.
[tool.cibuildwheel]
archs = ["auto64"]
skip = ["cp31?t-*", "cp315-*"]
test-requires = ["pytest>=8"]
test-command = "python -m pytest -q {project}/tests"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests", "benchmarks"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The benchmark drivers keep long report strings on one line
[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E501"]

[tool.mypy]
strict = true
# NumPy arithmetic on arrays of unspecified dtype is typed as Any
warn_return_any = false
packages = ["pycdloop"]
mypy_path = "src"
